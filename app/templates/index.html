<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notion x Kakaowork Sync Assistant</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root {
            /* 노션/카카오워크 사용자 모드 (밝은 톤) */
            --bg-main: #ffffff;
            --bg-sidebar: #f7f6f3;
            --bg-card: #f1f0ec;
            --text-primary: #37352f;
            --text-secondary: #787774;
            --border-color: #e9e8e4;
            --brand-color: #fee500; /* 카카오 노란색 포인트 */
            --brand-text: #191919;
            --chat-user: #feeb5d;
            --chat-ai: #f1f0ec;
        }

        body.admin-mode {
            /* 노션 다크모드 x 관리자 톤 */
            --bg-main: #191919;
            --bg-sidebar: #202020;
            --bg-card: #2f2f2f;
            --text-primary: #rgba(255, 255, 255, 0.9);
            --text-secondary: #9b9b9b;
            --border-color: #2f2f2f;
            --brand-color: #3182ce; /* 관리자 블루 포인트 */
            --brand-text: #ffffff;
            --chat-user: #2b4c7e;
            --chat-ai: #2f2f2f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background: var(--bg-main); color: var(--text-primary); height: 100vh; display: flex; transition: background 0.2s ease, color 0.2s ease; }

        /* 노션 스타일 사이드바 */
        .sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .workspace-header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; padding: 8px; border-radius: 6px; margin-bottom: 20px; }
        .workspace-icon { width: 20px; height: 20px; background: var(--brand-color); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: var(--brand-text); }

        .section-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; padding-left: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* 모드 전환 토글 스위치 (노션 메뉴 스타일) */
        .mode-container { display: flex; flex-direction: column; gap: 4px; margin-bottom: 24px; }
        .mode-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-primary); transition: background 0.15s; }
        .mode-item:hover { background: rgba(0, 0, 0, 0.04); }
        body.admin-mode .mode-item:hover { background: rgba(255, 255, 255, 0.05); }
        .mode-item.active { background: var(--bg-card); font-weight: 600; }

        /* 노션 Callout 박스 스타일 (동기화 상태) */
        .callout-box { background: var(--bg-card); border-radius: 6px; padding: 12px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; border: 1px solid var(--border-color); }
        .callout-title { font-weight: 600; color: var(--text-primary); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

        /* 메인 채팅/노션 메인 뷰 */
        .main-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        .top-nav { height: 48px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 13px; color: var(--text-secondary); }
        .page-title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text-primary); }

        .chat-view { flex: 1; padding: 32px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
        
        /* 카카오워크 스타일 말풍선 */
        .msg-row { display: flex; flex-direction: column; max-width: 75%; }
        .msg-row.user { align-self: flex-end; align-items: flex-end; }
        .msg-row.ai { align-self: flex-start; align-items: flex-start; }

        .msg-author { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; padding: 0 4px; }
        .msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
        .msg-row.user .msg-bubble { background: var(--chat-user); color: #191919; border-bottom-right-radius: 2px; }
        .msg-row.ai .msg-bubble { background: var(--chat-ai); color: var(--text-primary); border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }

        /* 노션 검색바 스타일 입력창 */
        .input-container { padding: 20px 24px 32px; max-width: 800px; width: 100%; margin: 0 auto; }
        .input-box { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 12px; gap: 8px; }
        .input-box input { flex: 1; border: none; background: transparent; padding: 8px 4px; font-size: 14px; color: var(--text-primary); outline: none; font-family: inherit; }
        .send-btn { background: var(--brand-color); color: var(--brand-text); border: none; border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 노션 사이드바 -->
    <div class="sidebar">
        <div>
            <div class="workspace-header">
                <div class="workspace-icon" id="brandIcon">KW</div>
                <span>Kakaowork x Notion</span>
            </div>

            <div class="section-label">권한 및 뷰 선택</div>
            <div class="mode-container">
                <div class="mode-item active" id="userModeBtn" onclick="setMode('USER')">
                    <span>💬 사용자 모드 (일반방)</span>
                </div>
                <div class="mode-item" id="adminModeBtn" onclick="setMode('ADMIN')">
                    <span>🔒 관리자 모드 (PM/부서장)</span>
                </div>
            </div>

            <div class="section-label">동기화 상태</div>
            <div class="callout-box">
                <div class="callout-title">
                    <span>📌</span>
                    <span id="targetRoomTitle">일반/친구 소모임방</span>
                </div>
                <div id="targetRoomDesc">선택한 카카오워크 톡방 대화에서 AI가 회의 일정을 추출해 노션 DB로 자동 동기화합니다.</div>
            </div>
        </div>

        <div style="font-size: 11px; color: var(--text-secondary); text-align: center;">
            Kakaowork API + Claude + Notion
        </div>
    </div>

    <!-- 메인 대화 영역 -->
    <div class="main-container">
        <div class="top-nav">
            <div class="page-title">
                <span id="pageIcon">📄</span>
                <span id="pageTitle">사용자 일정 동기화 챗봇</span>
            </div>
            <div style="font-size: 11px;" id="statusBadge">● Kakaowork Connected</div>
        </div>

        <div class="chat-view" id="chatView">
            <div class="msg-row ai">
                <div class="msg-author">Notion AI Bot</div>
                <div class="msg-bubble">
                    안녕하세요! 카카오워크 대화 내용을 기반으로 이번 달 회의 일정을 정리해 드립니다. 궁금한 점을 물어보세요.
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="이번 달 잡힌 회의 정리해서 노션에 적어줘..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <script>
        function setMode(mode) {
            const body = document.body;
            const userBtn = document.getElementById('userModeBtn');
            const adminBtn = document.getElementById('adminModeBtn');
            const pageTitle = document.getElementById('pageTitle');
            const pageIcon = document.getElementById('pageIcon');
            const targetRoomTitle = document.getElementById('targetRoomTitle');
            const targetRoomDesc = document.getElementById('targetRoomDesc');
            const brandIcon = document.getElementById('brandIcon');

            if (mode === 'ADMIN') {
                body.classList.add('admin-mode');
                adminBtn.classList.add('active');
                userBtn.classList.remove('active');
                pageTitle.innerText = "관리자 전용 (PM / 부서장 회의록 Sync)";
                pageIcon.innerText = "🔐";
                targetRoomTitle.innerText = "PM 및 부서장 전용방";
                targetRoomDesc.innerText = "기밀 및 프로젝트 관리용 카카오워크 톡방만 지정하여 노션 DB로 전송합니다.";
                brandIcon.innerText = "ADM";
            } else {
                body.classList.remove('admin-mode');
                userBtn.classList.add('active');
                adminBtn.classList.remove('active');
                pageTitle.innerText = "사용자 일정 동기화 챗봇";
                pageIcon.innerText = "📄";
                targetRoomTitle.innerText = "일반/친구 소모임방";
                targetRoomDesc.innerText = "선택한 카카오워크 톡방 대화에서 AI가 회의 일정을 추출해 노션 DB로 자동 동기화합니다.";
                brandIcon.innerText = "KW";
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const chatView = document.getElementById('chatView');

            // 유저 말풍선
            const userRow = document.createElement('div');
            userRow.className = 'msg-row user';
            userRow.innerHTML = `
                <div class="msg-author">Me</div>
                <div class="msg-bubble">${text}</div>
            `;
            chatView.appendChild(userRow);

            input.value = '';

            // AI 답변 말풍선
            setTimeout(() => {
                const aiRow = document.createElement('div');
                aiRow.className = 'msg-row ai';
                aiRow.innerHTML = `
                    <div class="msg-author">Notion AI Bot</div>
                    <div class="msg-bubble">카카오워크 톡방 대화를 Claude가 파싱 중입니다. 회의 일정을 추출하여 노션 페이지에 기록하고 있습니다...</div>
                `;
                chatView.appendChild(aiRow);
                chatView.scrollTop = chatView.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
